name: Official Pi05 protocol checks
on:
  push:
    paths: ['deploy/official-pi05/**', '.github/workflows/official-protocol.yml']
  pull_request:
    paths: ['deploy/official-pi05/**', '.github/workflows/official-protocol.yml']
permissions:
  contents: read
jobs:
  cpu-protocol:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 PyYAML==6.0.2 websockets==15.0.1
      - name: Validate shell and original WSS protocol suite (mock model)
        env:
          PYTHONPATH: deploy/official-pi05:deploy/official-pi05/vendor
          CUDA_VISIBLE_DEVICES: ''
          JAX_PLATFORMS: cpu
        run: |
          for script in deploy/official-pi05/*.sh; do bash -n "$script"; done
          python -m unittest discover -s deploy/official-pi05/tests -v
