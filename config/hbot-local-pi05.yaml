# Independent pi05 local smoke test: six tasks, one episode per task.
# base-experimental scores are NOT an official H-Bot baseline.
evaluation_id: local-pi05-experimental
team_id: contest-team
policy:
  model_type: server
  model_yaml: /home/users/wangmengfan/config/local_server_pi05.yaml
defaults:
  asset_root: ${ORCHARD_ASSET}/OBJECTS_v2
  splits: ${ORCHARD_ASSET}/OBJECTS_v2/splits/hbot_panda_droid_split_seen.yaml
  episode_num: 50
  seed: 100000
tasks:
  pick_color:
    task_type: pick_attribute
    yaml: robo_orchard_sim/benchmark/manipulation/semantic_pick/configs/pick_color.yaml
    split_type: seen
    max_steps: 200
  pick_spatial:
    task_type: spatial_directions
    yaml: robo_orchard_sim/benchmark/manipulation/spatial_relation/configs/spatial_directions.yaml
    split_type: seen
    max_steps: 200
    swap:
      enabled: true
  place_a2b:
    task_type: place_a2b
    yaml: robo_orchard_sim/benchmark/manipulation/place_a2b/configs/place_a2b.yaml
    split_type: seen
    max_steps: 300
  stack_cubes:
    task_type: stack_cubes
    yaml: robo_orchard_sim/benchmark/manipulation/stack_cubes/configs/stack_cubes.yaml
    max_steps: 900
  open_drawer:
    task_type: open
    yaml: robo_orchard_sim/benchmark/manipulation/open/configs/open_drawer.yaml
    split_type: seen
    max_steps: 300
    swap:
      enabled: true
  joint_direction:
    task_type: joint_direction
    yaml: robo_orchard_sim/benchmark/manipulation/joint_direction/configs/joint_direction.yaml
    split_type: seen
    max_steps: 300
    swap:
      enabled: true
